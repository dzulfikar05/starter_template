services:
    postgres:
        image: postgres:16-alpine
        container_name: starter-template-postgres
        restart: unless-stopped
        ports:
            - "${POSTGRES_PORT:-5432}:5432"
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: starter_template
        volumes:
            - starter_template_postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d starter_template"]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    starter_template_postgres_data:
